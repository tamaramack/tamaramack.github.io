# Deploy to GitHub Pages
# https://nuxt.com/deploy/github-pages
name: Deploy to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - development
  pull_request:
    branches:
      - development

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/portfolio
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: apps/portfolio/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Build static site for GitHub Pages root
        run: pnpm build:pages
        env:
          NUXT_APP_BASE_URL: /
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/portfolio/.output/public

  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
