name: Promote development to main

on:
  workflow_run:
    workflows: [Deploy to GitHub Pages]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  promote:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'development' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Create or update promotion PR
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          EXISTING=$(gh pr list --repo "${{ github.repository }}" --base main --head development --state open --json number -q '.[0].number' || true)
          if [ -z "${EXISTING}" ]; then
            if ! gh pr create --repo "${{ github.repository }}" --base main --head development \
              --title "Promote development to main" \
              --body "Auto-generated after CI succeeds on \`development\`. Squash-merged when checks pass."; then
              echo "No changes to promote."
              exit 0
            fi
            EXISTING=$(gh pr list --repo "${{ github.repository }}" --base main --head development --state open --json number -q '.[0].number')
          fi
          echo "number=${EXISTING}" >> "$GITHUB_OUTPUT"

      - name: Enable squash auto-merge
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge "${{ steps.pr.outputs.number }}" --repo "${{ github.repository }}" --auto --squash

      # Merges performed with GITHUB_TOKEN do not emit push workflow runs.
      # workflow_dispatch is allowed to chain from GITHUB_TOKEN, so deploy Pages after merge.
      - name: Wait for promotion merge then deploy Pages
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 90); do
            STATE=$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json state -q .state)
            if [ "$STATE" = "MERGED" ]; then
              gh workflow run "Deploy to GitHub Pages" --repo "${{ github.repository }}" --ref main
              echo "Dispatched Deploy to GitHub Pages on main after PR #$PR_NUMBER merged."
              exit 0
            fi
            if [ "$STATE" = "CLOSED" ]; then
              echo "Promotion PR #$PR_NUMBER closed without merge; skipping Pages deploy."
              exit 0
            fi
            sleep 10
          done
          echo "Timed out waiting for PR #$PR_NUMBER to merge." >&2
          exit 1
